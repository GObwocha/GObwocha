    <rect x="20" y="74" width="286" height="62" rx="3" fill="#0A0A09" stroke="#262522" />
    <text x="34" y="98" fill="#F5F3EE" font-family="monospace" font-size="11">CRITERION A: ALGORITHMIC CORRECTNESS</text>
    <text x="34" y="118" fill="#FF4D1C" font-family="monospace" font-size="11" font-weight="700">VERIFIED // 18 / 20 PTS</text>

    <rect x="20" y="148" width="286" height="62" rx="3" fill="#0A0A09" stroke="#262522" />
    <text x="34" y="172" fill="#F5F3EE" font-family="monospace" font-size="11">CRITERION B: COMPLEXITY JUSTIFICATION</text>
    <text x="34" y="192" fill="#B8B3A8" font-family="monospace" font-size="11">NEEDS SOCRATIC PROMPT // 12 / 20 PTS</text>

    <rect x="20" y="222" width="286" height="62" rx="3" fill="#0A0A09" stroke="#FF4D1C" />
    <text x="34" y="246" fill="#F5F3EE" font-family="monospace" font-size="11">GUARDRAIL: ZERO ANSWER SPOILING</text>
    <text x="34" y="266" fill="#FF4D1C" font-family="monospace" font-size="11" font-weight="700">ROUTED TO SOCRATIC TUTOR</text>
