<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="GeliScope AI Educational Diagnostic and Socratic Tutoring Portal">
  <rect width="800" height="500" fill="#0A0A09" />
  <g stroke="#262522" stroke-width="1">
    <line x1="0" y1="64" x2="800" y2="64" />
    <line x1="0" y1="444" x2="800" y2="444" />
    <line x1="390" y1="64" x2="390" y2="444" />
  </g>

  <!-- Header -->
  <text x="32" y="40" fill="#FF4D1C" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">SYS // 05 — GELISCOPE MULTIMODAL DIAGNOSTIC PORTAL</text>
  <text x="530" y="40" fill="#B8B3A8" font-family="monospace" font-size="12" letter-spacing="1.5">VUE 3 · VUETIFY 3 · PINIA</text>

  <!-- Left: Gemini Vision Rubric Evaluator -->
  <text x="32" y="96" fill="#B8B3A8" font-family="monospace" font-size="11" letter-spacing="1.5">01 / GEMINI VISION RUBRIC EVALUATOR</text>

  <g transform="translate(32, 114)">
    <rect width="326" height="304" rx="4" fill="#121210" stroke="#262522" />
