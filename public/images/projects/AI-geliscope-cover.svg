  <!-- Right: Bloom's Taxonomy Socratic State Machine -->
  <text x="418" y="96" fill="#B8B3A8" font-family="monospace" font-size="11" letter-spacing="1.5">02 / BLOOM&apos;S TAXONOMY SOCRATIC ENGINE</text>

  <g transform="translate(418, 114)">
    <rect width="350" height="44" rx="3" fill="#121210" stroke="#262522" />
    <text x="16" y="27" fill="#B8B3A8" font-family="monospace" font-size="12">L1 // REMEMBER — Recall foundational definitions</text>

