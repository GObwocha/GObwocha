    <text x="16" y="287" fill="#F5F3EE" font-family="monospace" font-size="12">L6 // CREATE — Synthesize original solution</text>
  </g>

  <text x="32" y="476" fill="#B8B3A8" font-family="monospace" font-size="11">STACK: VUE 3 COMPOSITION API · TYPESCRIPT · VUETIFY 3 · PINIA · GEMINI VISION</text>
